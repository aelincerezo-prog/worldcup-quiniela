<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧠 Reto del Día</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #0f1117;
      --bg2:    #181c27;
      --bg3:    #1e2333;
      --border: rgba(255,255,255,.08);
      --border2:rgba(255,255,255,.16);
      --text:   #f0f2f8;
      --text2:  #8892aa;
      --accent: #f59e0b;
      --green:  #22c55e;
      --red:    #ef4444;
      --radius: 14px;
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* Nav */
    .nav { display:flex; align-items:center; justify-content:space-between; padding:.9rem 1.25rem; border-bottom:1px solid var(--border); background:var(--bg2); }
    .nav-brand { font-weight:800; font-size:1rem; text-decoration:none; color:var(--text); }
    .nav-user  { font-size:.82rem; color:var(--text2); display:flex; align-items:center; gap:.75rem; }
    .nav-pts   { font-weight:700; color:var(--accent); }
    .btn-sm { padding:.35rem .8rem; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text2); font-size:.8rem; cursor:pointer; }
    .btn-sm:hover { background:var(--bg3); }

    .container { max-width:620px; margin:0 auto; padding:1.5rem 1rem 4rem; }

    /* Auth screen */
    #auth-screen { max-width:380px; margin:3rem auto; padding:0 1rem; }
    .auth-title { font-size:1.4rem; font-weight:800; text-align:center; margin-bottom:.4rem; }
    .auth-sub   { color:var(--text2); text-align:center; font-size:.88rem; margin-bottom:1.5rem; }
    .card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; }
    .form-group { margin-bottom:1rem; }
    .form-group label { display:block; font-size:.8rem; font-weight:600; color:var(--text2); margin-bottom:.4rem; text-transform:uppercase; letter-spacing:.05em; }
    .form-group input { width:100%; padding:.7rem 1rem; background:var(--bg3); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:.95rem; outline:none; }
    .form-group input:focus { border-color:var(--accent); }
    .btn-primary { width:100%; padding:.8rem; background:var(--accent); color:#000; font-weight:700; font-size:.95rem; border:none; border-radius:10px; cursor:pointer; margin-top:.25rem; }
    .btn-primary:hover { filter:brightness(1.1); }
    .form-error { color:var(--red); font-size:.82rem; margin-top:.6rem; text-align:center; min-height:1.2em; }

    /* Difficulty badge */
    .diff-badge { display:inline-flex; align-items:center; gap:.35rem; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:.25rem .65rem; border-radius:99px; }
    .diff-medium { background:rgba(34,197,94,.12); color:var(--green); border:1px solid rgba(34,197,94,.3); }
    .diff-hard   { background:rgba(239,68,68,.12);  color:var(--red);   border:1px solid rgba(239,68,68,.3); }

    /* Question card */
    .q-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:1.75rem 1.5rem; margin-bottom:1.25rem; }
    .q-meta { display:flex; align-items:center; gap:.75rem; margin-bottom:1.25rem; }
    .q-day  { font-size:.78rem; color:var(--text2); }
    .q-prompt {
      font-size:1.05rem; font-weight:600; line-height:1.7;
      white-space:pre-wrap;
    }
    .q-prompt .blank { display:inline-block; min-width:2.5rem; border-bottom:3px solid var(--accent); color:var(--accent); font-weight:900; text-align:center; padding:0 .3rem; }

    /* Answer input */
    .answer-wrap { display:flex; gap:.75rem; margin-top:1.25rem; }
    .answer-input {
      flex:1; padding:.75rem 1rem; background:var(--bg3); border:2px solid var(--border);
      border-radius:10px; color:var(--text); font-size:1.1rem; font-weight:700; text-align:center;
      outline:none; letter-spacing:.05em;
    }
    .answer-input:focus { border-color:var(--accent); }
    .btn-submit {
      padding:.75rem 1.5rem; background:var(--accent); color:#000; font-weight:800;
      font-size:.95rem; border:none; border-radius:10px; cursor:pointer; white-space:nowrap;
    }
    .btn-submit:hover { filter:brightness(1.1); }
    .btn-submit:disabled { opacity:.5; cursor:not-allowed; }

    /* Result */
    .result-card { border-radius:var(--radius); padding:1.25rem 1.5rem; margin-top:1.25rem; }
    .result-correct  { background:rgba(34,197,94,.08); border:1px solid rgba(34,197,94,.3); }
    .result-wrong    { background:rgba(239,68,68,.08);  border:1px solid rgba(239,68,68,.3); }
    .result-header { display:flex; align-items:center; gap:.6rem; font-weight:800; font-size:1rem; margin-bottom:.6rem; }
    .result-correct .result-header { color:var(--green); }
    .result-wrong   .result-header { color:var(--red); }
    .result-pts   { font-size:.85rem; color:var(--text2); margin-bottom:.75rem; }
    .result-pts strong { color:var(--accent); }
    .result-answer { font-size:.88rem; color:var(--text2); margin-bottom:.5rem; }
    .result-answer strong { color:var(--text); }
    .result-explanation { font-size:.85rem; color:var(--text2); line-height:1.6; }

    /* Already answered */
    .answered-badge { display:flex; align-items:center; gap:.5rem; font-size:.82rem; color:var(--text2); background:var(--bg3); border-radius:8px; padding:.5rem .85rem; margin-top:1rem; }

    /* Leaderboard */
    .section-title { font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:.9rem; }
    .score-row { display:flex; align-items:center; gap:.85rem; padding:.65rem 0; border-bottom:1px solid var(--border); }
    .score-row:last-child { border-bottom:none; }
    .score-pos { font-size:.78rem; font-weight:700; color:var(--text2); width:1.5rem; text-align:center; }
    .score-name { flex:1; font-weight:600; font-size:.9rem; }
    .score-pts  { font-weight:800; color:var(--accent); font-size:.9rem; }
    .score-meta { font-size:.75rem; color:var(--text2); }
    .empty-scores { color:var(--text2); font-size:.88rem; text-align:center; padding:1rem 0; }

    .home-link { display:block; text-align:center; margin-top:1.5rem; color:var(--text2); font-size:.82rem; text-decoration:none; }
    .home-link:hover { color:var(--text); }
  </style>
</head>
<body>

<nav class="nav" id="navbar" style="display:none">
  <a class="nav-brand" href="/">← Inicio</a>
  <div class="nav-user">
    <span id="nav-username"></span>
    <span class="nav-pts" id="nav-pts"></span>
    <button class="btn-sm" onclick="logout()">Salir</button>
  </div>
</nav>

<!-- Auth screen -->
<div id="auth-screen">
  <p class="auth-title">🧠 Reto del Día</p>
  <p class="auth-sub">Inicia sesión para jugar</p>
  <div class="card">
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Usuario</label>
        <input id="l-user" type="text" placeholder="Tu usuario" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input id="l-pass" type="password" placeholder="Tu contraseña" autocomplete="current-password" required>
      </div>
      <div class="form-error" id="auth-err"></div>
      <button type="submit" class="btn-primary" id="login-btn">Entrar</button>
    </form>
  </div>
</div>

<!-- Game screen -->
<div id="game-screen" style="display:none">
  <div class="container">
    <div class="q-card" id="q-card">
      <div class="q-meta">
        <span class="diff-badge" id="diff-badge"></span>
        <span class="q-day" id="q-day"></span>
      </div>
      <div class="q-prompt" id="q-prompt"></div>
      <div id="answer-area"></div>
    </div>

    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;">
      <div class="section-title">🏆 Ranking del juego</div>
      <div id="scores-list"></div>
    </div>

    <a class="home-link" href="/">Ver página de cierre →</a>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
